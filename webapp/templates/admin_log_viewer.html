<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log Viewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version('style.css') }}">
</head>
<body>
  <div class="nav">
    <div class="brand">{{ server_name }} · ADMIN</div>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Menü öffnen">☰</button>
    <div class="links" id="nav-links">
      <a href="{{ url_for('admin_dashboard') }}">Übersicht</a>
      <a href="{{ url_for('admin_players') }}">Spieler</a>
      <a href="{{ url_for('admin_chat') }}">Chat</a>
      <a href="{{ url_for('admin_log_viewer') }}">Log Viewer</a>
      <a href="{{ url_for('admin_live_map') }}">Live-Karte</a>
      <a href="{{ url_for('admin_console') }}">Konsole</a>
      <a href="{{ url_for('admin_shop') }}">Shop</a>
      <a href="{{ url_for('home') }}">Zur Webseite</a>
      <a href="{{ url_for('admin_logout') }}">Logout</a>
    </div>
  </div>
  <div class="container" style="max-width:1100px;">
    <h1 style="text-transform:uppercase;">📄 Log Viewer</h1>

    <div class="toggle-group" style="margin-bottom:16px;">
      {% for cat in categories %}
      <a href="{{ url_for('admin_log_viewer', category=cat) }}" class="toggle-btn {{ 'active' if cat == category else '' }}">{{ cat }}</a>
      {% endfor %}
    </div>

    <div class="card">
      {% if lines %}
      <div style="font-family:'Liberation Mono',monospace; font-size:12px; max-height:70vh; overflow-y:auto;">
        {% for line in lines %}
        <div style="padding:3px 0; border-bottom:1px solid var(--panel-border); word-break:break-all;">{{ line }}</div>
        {% endfor %}
      </div>
      {% else %}
      <div class="empty">Keine Log-Zeilen gefunden.</div>
      {% endif %}
    </div>
  </div>
  <script>
    var navToggle = document.getElementById('nav-toggle');
    if (navToggle) {
      navToggle.addEventListener('click', function() {
        document.getElementById('nav-links').classList.toggle('open');
      });
    }
  </script>
</body>
</html>
